<!-- templates/login.html -->
{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Animated Background -->
    <div class="absolute inset-0">
        <div class="absolute top-0 left-0 w-96 h-96 bg-gradient-to-r from-green-300 to-emerald-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-float"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-gradient-to-r from-blue-300 to-indigo-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-float-reverse"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-128 h-128 bg-gradient-to-r from-purple-300 to-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse-slow"></div>
    </div>
    
    <div class="relative bg-white rounded-3xl shadow-2xl overflow-hidden max-w-md w-full animate-fadeIn transform transition-all duration-500">
        <div class="gradient-bg h-2 animate-shimmer"></div>
        
        <div class="p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-green-500 to-emerald-600 mb-4 animate-pulse-slow">
                    <i class="fas fa-hand-holding-heart text-3xl text-white"></i>
                </div>
                <h2 class="text-3xl font-bold gradient-text">Welcome Back</h2>
                <p class="text-gray-500 mt-2">Sign in to continue your journey</p>
            </div>
            
            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                <div class="group">
                    <label class="block text-sm font-medium text-gray-700 mb-2 transform transition-all group-focus-within:text-green-600">
                        <i class="fas fa-envelope mr-2 text-green-500"></i>Email / Username
                    </label>
                    <input type="text" name="username" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-300 outline-none"
                        placeholder="Enter your email or username">
                </div>
                
                <div class="group">
                    <label class="block text-sm font-medium text-gray-700 mb-2 transform transition-all group-focus-within:text-green-600">
                        <i class="fas fa-lock mr-2 text-green-500"></i>Password
                    </label>
                    <input type="password" name="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-300 outline-none"
                        placeholder="Enter your password">
                </div>
                
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="rounded text-green-500 focus:ring-green-500">
                        <span class="ml-2 text-sm text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-green-600 hover:text-green-700 transition-colors">Forgot password?</a>
                </div>
                
                <button type="submit" 
                    class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-3 rounded-xl font-semibold hover:shadow-lg transform hover:scale-[1.02] transition-all duration-300 relative overflow-hidden group">
                    <span class="relative z-10">Sign In</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-green-600 to-emerald-700 transform translate-x-full group-hover:translate-x-0 transition-transform duration-300"></div>
                </button>
            </form>
            
            <!-- templates/login.html - Fix register link -->
<div class="mt-6 text-center">
    <p class="text-gray-600">Don't have an account? 
        <a href="/register/" class="text-green-600 font-semibold hover:text-green-700 transition-colors relative group">
            Register here
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-green-600 group-hover:w-full transition-all duration-300"></span>
        </a>
    </p>
</div>
        </div>
    </div>
</div>
{% endblock %}
