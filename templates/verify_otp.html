<!-- templates/verify_otp.html -->
{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Animated Background -->
    <div class="absolute inset-0">
        <div class="absolute top-0 left-0 w-96 h-96 bg-gradient-to-r from-green-300 to-emerald-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-float"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-gradient-to-r from-blue-300 to-indigo-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-float-reverse"></div>
    </div>
    
    <div class="relative bg-white rounded-3xl shadow-2xl overflow-hidden max-w-md w-full animate-fadeIn">
        <div class="gradient-bg h-2 animate-shimmer"></div>
        
        <div class="p-8 text-center">
            <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-gradient-to-r from-green-500 to-emerald-600 mb-6 animate-pulse-slow">
                <i class="fas fa-envelope-open-text text-4xl text-white"></i>
            </div>
            
            <h2 class="text-2xl font-bold gradient-text mb-2">Verify Your Email</h2>
            <p class="text-gray-600 mb-6">
                We've sent a 6-digit OTP to <strong class="text-green-600">{{ email }}</strong>
            </p>
            
            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                <div class="flex justify-center space-x-2">
                    <input type="text" name="otp" required maxlength="6" pattern="\d{6}"
                        class="w-full px-4 py-3 text-center text-2xl tracking-widest border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition-all duration-300"
                        placeholder="000000"
                        id="otpInput">
                </div>
                
                <button type="submit" 
                    class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-3 rounded-xl font-semibold hover:shadow-lg transform hover:scale-[1.02] transition-all duration-300 relative overflow-hidden group">
                    <span class="relative z-10">Verify Account</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-green-600 to-emerald-700 transform translate-x-full group-hover:translate-x-0 transition-transform duration-300"></div>
                </button>
            </form>
            
            <!-- templates/verify_otp.html - Fix register link -->
<div class="mt-6">
    <p class="text-sm text-gray-500">
        Didn't receive the code? 
        <a href="/register/" class="text-green-600 font-semibold hover:text-green-700 transition-colors">
            Register again
        </a>
    </p>
    <div class="mt-4 text-xs text-gray-400">
        <i class="fas fa-clock mr-1"></i>OTP expires in 5 minutes
    </div>
</div>
        </div>
    </div>
</div>

<script>
    // Auto-focus and add animation to OTP input
    document.getElementById('otpInput').focus();
    
    // Add countdown timer
    let timeLeft = 300;
    const timerElement = document.createElement('div');
    timerElement.className = 'text-sm text-gray-500 mt-2';
    document.querySelector('.text-xs.text-gray-400').parentNode.appendChild(timerElement);
    
    const timer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerElement.innerHTML = `<i class="fas fa-hourglass-half mr-1"></i>Time remaining: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        
        if (timeLeft <= 0) {
            clearInterval(timer);
            timerElement.innerHTML = '<i class="fas fa-exclamation-circle mr-1"></i>OTP expired. Please register again.';
            timerElement.classList.add('text-red-500');
        }
        timeLeft--;
    }, 1000);
</script>
{% endblock %}
